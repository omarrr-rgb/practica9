name: 01 - Mi primer workflow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  saludo:
    runs-on: ubuntu-latest
    steps:
      - name: Mostrar mensaje
        run: echo "GitHub Actions inició por un evento"
      - name: Mostrar contexto básico
        run: echo "Evento=$GITHUB_EVENT_NAME Rama=$GITHUB_REF_NAME"
